    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* === Base Reset === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { display: none; }
        html { 
            scrollbar-width: none; 
            background-color: #f9f9f7; 
        }

        body {
            height: 400vh; 
            background-color: #f9f9f7;
            margin: 0;
            overflow-x: hidden;
            cursor: default;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* === Fixed Stage === */
        #stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        /* === Background Noise === */
        #stage::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.8;
            z-index: -1;
        }

        /* === Tanka Wrapper === */
        #tanka-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* === Tanka Part === */
        .tanka-part {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            
            writing-mode: vertical-rl;
            text-orientation: upright;
            
            display: inline-block;
            white-space: nowrap; 
            text-align: center;
            
            height: auto; 
            max-height: 85vh; 
            
            font-family: 'Shippori Mincho', serif;
            font-weight: 500;
            color: #1a1a1a;
            text-shadow: 0 0 1px rgba(0,0,0,0.15);
            
            font-size: 16px;
            letter-spacing: 0.4em; 
            
            will-change: transform, opacity;
        }
        
        .tanka-part:first-child {
            left: 50%; 
            margin-left: 1.5vw; 
        }

        .tanka-part:last-child {
            right: 50%; 
            margin-right: 1.5vw; 
        }
        
        @media (max-width: 768px) {
            .tanka-part:first-child {
                margin-left: 4vw; 
            }
            .tanka-part:last-child {
                margin-right: 4vw; 
            }
        }

        /* === Character === */
        .char {
            display: inline-block;
            vertical-align: middle;
            opacity: 0;
            transform: translateY(-25px) scale(0.9);
            filter: blur(8px);
            will-change: transform, opacity, filter;
            margin-top: 0.3em; 
            line-height: 1; 
        }
        .char:first-child {
            margin-top: 0;
        }

        /* === Veil === */
        #veil {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f9f9f7;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #veil.active {
            opacity: 1;
        }

        /* === Scroll Guide (一筋の雨) === */
        #scroll-guide {
            position: fixed;
            bottom: 0;
            left: 50%;
            width: 1px;
            height: 80px; 
            background: linear-gradient(to bottom, rgba(26,26,26,0.3), transparent);
            z-index: 15;
            pointer-events: none;
            
            opacity: 0;
            transform-origin: top;
            animation: flow-line 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
            transition: opacity 0.5s;
        }

        @keyframes flow-line {
            0% { transform: scaleY(0); opacity: 0; }
            30% { transform: scaleY(1); opacity: 0.4; transform-origin: top; }
            31% { transform-origin: bottom; }
            100% { transform: scaleY(0); opacity: 0; transform-origin: bottom; }
        }

    </style>
</head>
<body>

    <div id="veil"></div>
    
    <div id="stage">
        <div id="tanka-wrapper"></div>
    </div>
    
    <div id="scroll-guide"></div>
