<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>怪獣たちの眠るとこ</title>

    <meta property="og:title" content="怪獣たちの眠るとこ">
    <meta property="og:type" content="website">
    <meta property="og:description" content="静寂とノイズの狭間で読む、短歌ポートフォリオ。">
    <meta property="og:site_name" content="怪獣たちの眠るとこ">
    <meta property="og:url" content="https://app.netlify.com/"> 
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* === Base Reset === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { display: none; }
        html { 
            scrollbar-width: none; 
            background-color: #f9f9f7; 
            overscroll-behavior-y: none; /* バウンススクロール防止 */
        }

        body {
            /* スクロール領域を確保 */
            height: 400vh; 
            background-color: #f9f9f7;
            margin: 0;
            overflow-x: hidden;
            cursor: default;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-family: 'Shippori Mincho', 'Yu Mincho', 'Hiragino Mincho ProN', serif; /* フォールバック追加 */
        }

        /* === Fixed Stage === */
        #stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* スクロール操作を阻害しない */
            z-index: 10;
        }

        /* === Background Noise === */
        #stage::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.8;
            z-index: -1;
        }

        /* === Tanka Wrapper === */
        #tanka-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* === Tanka Part === */
        .tanka-part {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            
            writing-mode: vertical-rl;
            text-orientation: upright;
            
            display: inline-block;
            white-space: nowrap; 
            text-align: center;
            
            /* フォント読み込み前でも高さを確保 */
            min-height: 200px;
            
            font-weight: 500;
            color: #1a1a1a;
            text-shadow: 0 0 1px rgba(0,0,0,0.15);
            
            font-size: 16px;
            letter-spacing: 0.4em; 
            
            will-change: transform, opacity;
        }
        
        .tanka-part:first-child {
            left: 50%; 
            margin-left: 2vw; 
        }

        .tanka-part:last-child {
            right: 50%; 
            margin-right: 2vw; 
        }
        
        @media (max-width: 768px) {
            .tanka-part:first-child { margin-left: 6vw; }
            .tanka-part:last-child { margin-right: 6vw; }
        }

        /* === Character === */
        .char {
            display: inline-block;
            vertical-align: middle;
            opacity: 0; /* JSで制御するが初期値は隠す */
            transform: translateY(-20px);
            filter: blur(5px);
            will-change: transform, opacity, filter;
            margin-top: 0.3em; 
            line-height: 1; 
        }
        .char:first-child {
            margin-top: 0;
        }

        /* === Veil (遷移時の幕) === */
        #veil {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f9f9f7;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #veil.active {
            opacity: 1;
        }

        /* === Scroll Guide === */
        #scroll-guide {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 15;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .scroll-text {
            font-family: sans-serif;
            font-size: 10px;
            letter-spacing: 0.2em;
            color: rgba(26,26,26,0.4);
            text-transform: uppercase;
        }

        .scroll-line {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, rgba(26,26,26,0.3), transparent);
            animation: flow-line 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes flow-line {
            0% { transform: scaleY(0); opacity: 0; transform-origin: top; }
            40% { transform: scaleY(1); opacity: 0.6; transform-origin: top; }
            41% { transform-origin: bottom; }
            100% { transform: scaleY(0); opacity: 0; transform-origin: bottom; }
        }

    </style>
</head>
<body>

    <div id="veil"></div>
    
    <div id="stage">
        <div id="tanka-wrapper"></div>
    </div>
    
    <div id="scroll-guide">
        <span class="scroll-text">Scroll</span>
        <div class="scroll-line"></div>
    </div>
    
    <script>
        const sourceTankaList = [
            ["滅菌のガーゼのような夜明け前", "わたしを削り命を磨く"],
            ["治癒という名の暴力を携えて", "三頭身ゆく全滅の野を"],
            ["虚空から綿埃だけ呼び寄せる", "磁石のような湿った指よ"],
            ["栄養も祈りもすべて宙を舞い", "エントロピーへと還る食卓"],
            ["握力に目覚めたばかりの獣ゆえ", "愛撫のように皿を弾いた"],
            ["引力を忘れたような爪先が", "月の裏側蹴り上げている"],
            ["冷めていくこともひとつの味だから", "焦る世界を君は笑った"],
            ["陽だまりを食べているのと変わらない", "ふっくらとした時間の余白"],
            ["リチウムの熱暴走に似た命", "充電不可の怒りをはなつ"],
            ["体温の不法投棄だ生温い", "液体そっと抱く朝"],
            ["プリズムを通せば違う色になる", "光の束としてそこに居る"]
        ];

        let tankaList = [];
        let currentIndex = 0;
        let isTransitioning = false;
        
        const wrapper = document.getElementById('tanka-wrapper');
        const veil = document.getElementById('veil');
        const scrollGuide = document.getElementById('scroll-guide');
        
        let allCharElements = []; 

        let targetScroll = 0;
        let currentScroll = 0;
        const lerpFactor = 0.08; // 追従速度を少し上げました

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function adjustTypography(tankaParts) {
            const viewportHeight = window.innerHeight;
            const longestPartLength = Math.max(tankaParts[0].length, tankaParts[1].length);

            // フォントサイズの計算を少し大きめに調整
            let fontSizePx = Math.min(
                26, 
                (viewportHeight * 0.7) / (longestPartLength * 1.4)
            );
            fontSizePx = Math.max(14, fontSizePx); 

            const partElements = wrapper.querySelectorAll('.tanka-part');
            partElements.forEach(part => {
                part.style.fontSize = `${fontSizePx}px`;
            });
            
            // 文字間隔の調整
            const charSpans = wrapper.querySelectorAll('.char');
            charSpans.forEach(char => {
                char.style.marginTop = '0.35em';
            });
            wrapper.querySelectorAll('.tanka-part .char:first-child').forEach(firstChar => {
                firstChar.style.marginTop = '0';
            });
        }

        function init() {
            tankaList = shuffleArray([...sourceTankaList]);
            loadTanka(0);
            
            window.addEventListener('scroll', () => {
                targetScroll = window.scrollY;
            });
            
            window.addEventListener('resize', () => {
                if (tankaList[currentIndex]) adjustTypography(tankaList[currentIndex]);
            });

            // 強制的に初期描画を実行
            updateVisuals(0);
            requestAnimationFrame(animate);
        }

            wrapper.innerHTML = '';
            allCharElements = [];
            const currentTanka = tankaList[index];

            currentTanka.forEach((partText, partIndex) => {
                const partDiv = document.createElement('div');
                partDiv.classList.add('tanka-part');
                partDiv.dataset.partIndex = partIndex; 

                Array.from(partText).forEach((char, charIndex) => {
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.classList.add('char');
                    
                    span.dataset.part = partIndex; 
                    span.dataset.index = charIndex;
