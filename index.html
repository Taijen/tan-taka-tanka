<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>怪獣たちの眠るとこ</title>

    <!-- OGP -->
    <meta property="og:title" content="怪獣たちの眠るとこ">
    <meta property="og:type" content="website">
    <meta property="og:description" content="静寂とノイズの狭間で読む、短歌ポートフォリオ。">
    <meta property="og:site_name" content="怪獣たちの眠るとこ">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* === Base Reset === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { display: none; }
        html {
            scrollbar-width: none;
            background-color: #f9f9f7;
            overscroll-behavior-y: none;
        }

        body {
            height: 400vh;
            background-color: #f9f9f7;
            margin: 0;
            overflow-x: hidden;
            cursor: default;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* === Fixed Stage === */
        #stage {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        /* === Background Noise === */
        #stage::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.8;
            z-index: -1;
        }

        /* === Tanka Wrapper === */
        #tanka-wrapper {
            position: relative;
            width: 100%; height: 100%;
        }

        /* === Tanka Part === */
        .tanka-part {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            text-orientation: upright;
            display: inline-block;
            white-space: nowrap;
            text-align: center;
            height: auto;
            max-height: 85vh;
            min-height: 200px;
            font-family: 'Shippori Mincho', 'Yu Mincho', serif;
            font-weight: 500;
            color: #1a1a1a;
            text-shadow: 0 0 1px rgba(0,0,0,0.15);
            font-size: 16px;
            letter-spacing: 0.4em;
            will-change: transform, opacity;
        }

        .tanka-part:first-child {
            left: 50%;
            margin-left: 1.5vw;
        }

        .tanka-part:last-child {
            right: 50%;
            margin-right: 1.5vw;
        }

        @media (max-width: 768px) {
            .tanka-part:first-child { margin-left: 4vw; }
            .tanka-part:last-child  { margin-right: 4vw; }
        }

        /* === Character === */
        .char {
            display: inline-block;
            vertical-align: middle;
            opacity: 0;
            transform: translateY(-25px) scale(0.9);
            filter: blur(8px);
            will-change: transform, opacity, filter;
            margin-top: 0.3em;
            line-height: 1;
        }
        .char:first-child { margin-top: 0; }

        /* === Veil (Transition) === */
        #veil {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f9f9f7;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #veil.active { opacity: 1; }

        /* === Scroll Guide === */
        #scroll-guide {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 1;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        #scroll-guide.hidden { opacity: 0; }

        #scroll-guide .label {
            font-family: 'Shippori Mincho', 'Yu Mincho', serif;
            font-size: 10px;
            letter-spacing: 0.15em;
            color: rgba(26, 26, 26, 0.3);
        }

        #scroll-guide .line {
            width: 1px;
            height: 40px;
            position: relative;
            overflow: hidden;
            background: rgba(26, 26, 26, 0.08);
        }

        #scroll-guide .line::after {
            content: "";
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.25);
            animation: scroll-flow 2s ease-in-out infinite;
        }

        @keyframes scroll-flow {
            0%   { top: -100%; }
            50%  { top: 100%; }
            50.01% { top: -100%; }
            100% { top: -100%; }
        }
    </style>
</head>
<body>

    <div id="veil"></div>

    <div id="stage">
        <div id="tanka-wrapper"></div>
    </div>

    <!-- Scroll Guide -->
    <div id="scroll-guide">
        <span class="label">scroll</span>
        <div class="line"></div>
    </div>

    <script>
        /* ============================================================
         *  短歌データ
         *  フォーマット: ["上句（五七五）", "下句（七七）"]
         *  新しい短歌はこの配列に追加するだけでOK
         * ============================================================ */
        const sourceTankaList = [
            ["滅菌のガーゼのような夜明け前", "わたしを削り命を磨く"],
            ["治癒という名の暴力を携えて", "三頭身ゆく全滅の野を"],
            ["虚空から綿埃だけ呼び寄せる", "磁石のような湿った指よ"],
            ["栄養も祈りもすべて宙を舞い", "エントロピーへと還る食卓"],
            ["握力に目覚めたばかりの獣ゆえ", "愛撫のように皿を弾いた"],
            ["引力を忘れたような爪先が", "月の裏側蹴り上げている"],
            ["冷めていくこともひとつの味だから", "焦る世界を君は笑った"],
            ["陽だまりを食べているのと変わらない", "ふっくらとした時間の余白"],
            ["リチウムの熱暴走に似た命", "充電不可の怒りをはなつ"],
            ["体温の不法投棄だ生温い", "液体そっと抱く朝"],
            ["プリズムを通せば違う色になる", "光の束としてそこに居る"],
        ];

        /* ============================================================
         *  State
         * ============================================================ */
        let tankaList = [];
        let currentIndex = 0;
        let isTransitioning = false;
        const wrapper = document.getElementById('tanka-wrapper');
        const veil = document.getElementById('veil');
        const scrollGuide = document.getElementById('scroll-guide');

        let allCharElements = [];
        let targetScroll = 0;
        let currentScroll = 0;
        const lerpFactor = 0.08;
        let scrollGuideVisible = true;

        /* ============================================================
         *  Utilities
         * ============================================================ */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function adjustTypography(tankaParts) {
            const viewportHeight = window.innerHeight;
            const paddingVh = 20;
            const availableHeightVh = 100 - paddingVh;

            const longestPartLength = Math.max(tankaParts[0].length, tankaParts[1].length);

            let fontSizePx = Math.min(
                24,
                (viewportHeight * availableHeightVh / 100) / (longestPartLength + (longestPartLength - 1) * 0.3)
            );
            fontSizePx = Math.max(14, fontSizePx);

            let charMarginTopEm = 0.35;
            if (longestPartLength > 15) {
                charMarginTopEm = Math.max(0.15, 0.35 - ((longestPartLength - 15) * 0.015));
            }

            wrapper.querySelectorAll('.tanka-part').forEach(part => {
                part.style.fontSize = `${fontSizePx}px`;
            });
            wrapper.querySelectorAll('.char').forEach(char => {
                char.style.marginTop = `${charMarginTopEm}em`;
            });
            wrapper.querySelectorAll('.tanka-part .char:first-child').forEach(fc => {
                fc.style.marginTop = '0';
            });
        }

        /* ============================================================
         *  Core
         * ============================================================ */
        function init() {
            tankaList = shuffleArray([...sourceTankaList]);
            loadTanka(0);

            window.addEventListener('resize', () => {
                if (tankaList[currentIndex]) adjustTypography(tankaList[currentIndex]);
            });

            requestAnimationFrame(animate);
        }

        function loadTanka(index) {
            wrapper.innerHTML = '';
            allCharElements = [];
            const currentTanka = tankaList[index];

            currentTanka.forEach((partText, partIndex) => {
                const partDiv = document.createElement('div');
                partDiv.classList.add('tanka-part');
                partDiv.dataset.partIndex = partIndex;

                Array.from(partText).forEach((char, charIndex) => {
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.classList.add('char');
                    span.dataset.part = partIndex;
                    span.dataset.index = charIndex;
                    partDiv.appendChild(span);
                    allCharElements.push(span);
                });
                wrapper.appendChild(partDiv);
            });

            adjustTypography(currentTanka);

            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
            window.scrollTo(0, 0);
            targetScroll = 0;
            currentScroll = 0;
        }

        function animate() {
            targetScroll = window.pageYOffset || document.documentElement.scrollTop;

            if (scrollGuideVisible && targetScroll > 10) {
                scrollGuideVisible = false;
                scrollGuide.classList.add('hidden');
            }

            currentScroll += (targetScroll - currentScroll) * lerpFactor;
            if (Math.abs(targetScroll - currentScroll) < 0.05) currentScroll = targetScroll;
            updateVisuals(currentScroll);
            requestAnimationFrame(animate);
        }

        function updateVisuals(scrollTop) {
            if (isTransitioning) return;

            const winHeight = window.innerHeight;
            const docHeight = document.body.scrollHeight;
            const maxScroll = docHeight - winHeight;
            let progress = Math.max(0, Math.min(1, scrollTop / maxScroll));

            const firstPartRange  = [0.02, 0.45];
            const secondPartRange = [0.55, 0.98];

            const firstPartLength  = tankaList[currentIndex][0].length;
            const secondPartLength = tankaList[currentIndex][1].length;

            allCharElements.forEach(char => {
                const part = parseInt(char.dataset.part);
                const idx  = parseInt(char.dataset.index);
                const totalInPart = (part === 0) ? firstPartLength : secondPartLength;
                const range = (part === 0) ? firstPartRange : secondPartRange;

                let relativeProgress = 0;
                if (progress >= range[0] && progress <= range[1]) {
                    relativeProgress = (progress - range[0]) / (range[1] - range[0]);
                } else if (progress > range[1]) {
                    relativeProgress = 1;
                }

                const charProgress = relativeProgress * (1 + (totalInPart * 0.1)) - (idx * 0.1);
                const alpha = Math.max(0, Math.min(1, charProgress));

                if (alpha > 0) {
                    char.style.opacity = alpha;
                    const yOffset = (1 - alpha) * -25;
                    const scale = 0.9 + (alpha * 0.1);
                    const blur = (1 - alpha) * 10;
                    char.style.transform = `translateY(${yOffset}px) scale(${scale})`;
                    char.style.filter = `blur(${blur}px)`;
                } else {
                    char.style.opacity = 0;
                }
            });

            if (progress > 0.99) goToNextTanka();
        }

        function goToNextTanka() {
            if (isTransitioning) return;
            isTransitioning = true;
            veil.classList.add('active');

            setTimeout(() => {
                currentIndex++;
                if (currentIndex >= tankaList.length) {
                    tankaList = shuffleArray([...sourceTankaList]);
                    currentIndex = 0;
                }
                loadTanka(currentIndex);
                setTimeout(() => {
                    veil.classList.remove('active');
                    isTransitioning = false;
                }, 500);
            }, 800);
        }

        init();
    </script>
</body>
</html>
